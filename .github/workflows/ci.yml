name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/runtime/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/runtime/requirements.txt pytest

      - name: Go tests
        run: go test ./...

      - name: Python tests
        run: python -m pytest python/runtime/tests -q

      - name: Offline agent eval
        run: python -m evals.run_agent_eval --mode offline --fail-on-threshold

      - name: Start Docker Compose dependencies
        run: docker compose up -d postgres etcd minio milvus

      - name: Integration agent eval
        env:
          DDI_EVAL_INTEGRATION: "1"
        run: python -m evals.run_agent_eval --mode integration --fail-on-threshold

      - name: End-to-end smoke
        env:
          DDI_PYTHON_CMD: python
        run: ./scripts/e2e_smoke.sh

      - name: Stop Docker Compose dependencies
        if: always()
        run: docker compose down -v
